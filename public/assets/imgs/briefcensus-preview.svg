<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-census" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg-census)"/>

  <!-- Top metadata badges -->
  <rect x="50" y="20" width="130" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="115" y="36" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">4-WEEK CAMPAIGN</text>

  <rect x="190" y="20" width="140" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="260" y="36" fill="#fde047" font-family="monospace" font-size="11" text-anchor="middle">FORWARD GREEDY</text>

  <rect x="340" y="20" width="140" height="24" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="410" y="36" fill="#a7f3d0" font-family="monospace" font-size="11" text-anchor="middle">DAY-RULE ESTIMATOR</text>

  <!-- Grid lines -->
  <line x1="50" y1="65" x2="50" y2="235" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="170" y1="65" x2="170" y2="235" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="290" y1="65" x2="290" y2="235" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="410" y1="65" x2="410" y2="235" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="550" y1="65" x2="550" y2="235" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="40" y1="235" x2="560" y2="235" stroke="#334155" stroke-width="1.5"/>

  <!-- Rooftop Fleet Sensor Selection Network visualization -->
  <!-- Background unselected candidate fleet nodes (faint cyan) -->
  <g fill="#0e7490" opacity="0.45">
    <circle cx="80" cy="190" r="4"/>
    <circle cx="110" cy="140" r="4"/>
    <circle cx="130" cy="205" r="4"/>
    <circle cx="150" cy="165" r="4"/>
    <circle cx="190" cy="180" r="4"/>
    <circle cx="210" cy="120" r="4"/>
    <circle cx="230" cy="195" r="4"/>
    <circle cx="260" cy="150" r="4"/>
    <circle cx="275" cy="100" r="4"/>
    <circle cx="310" cy="185" r="4"/>
    <circle cx="330" cy="130" r="4"/>
    <circle cx="350" cy="200" r="4"/>
    <circle cx="380" cy="160" r="4"/>
    <circle cx="410" cy="115" r="4"/>
    <circle cx="430" cy="175" r="4"/>
    <circle cx="450" cy="135" r="4"/>
    <circle cx="480" cy="190" r="4"/>
    <circle cx="510" cy="150" r="4"/>
    <circle cx="530" cy="210" r="4"/>
  </g>

  <!-- Network connection rays between selected hubs -->
  <line x1="120" y1="110" x2="250" y2="85" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="250" y1="85" x2="370" y2="95" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="370" y1="95" x2="470" y2="105" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="250" y1="85" x2="210" y2="170" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3"/>
  <line x1="370" y1="95" x2="390" y2="180" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3"/>

  <!-- Performance curve: Retention of Full-Year Information vs Campaign Duration (79.6% - 81.5%) -->
  <path d="M 50 220 C 100 200, 150 145, 230 115 S 400 95, 550 90" fill="none" stroke="url(#accent-cyan)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 50 220 C 100 200, 150 145, 230 115 S 400 95, 550 90 L 550 235 L 50 235 Z" fill="rgba(6, 182, 212, 0.08)"/>

  <!-- Selected permanent monitors (golden amber nodes with pulse rings) -->
  <circle cx="120" cy="110" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <circle cx="120" cy="110" r="7" fill="url(#amber-glow)"/>

  <circle cx="250" cy="85" r="16" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
  <circle cx="250" cy="85" r="8" fill="url(#amber-glow)"/>

  <circle cx="370" cy="95" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>
  <circle cx="370" cy="95" r="7" fill="url(#amber-glow)"/>

  <circle cx="470" cy="105" r="13" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <circle cx="470" cy="105" r="6.5" fill="url(#amber-glow)"/>

  <!-- Annotations on curve -->
  <rect x="235" y="112" width="130" height="20" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
  <text x="300" y="126" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">~80% GAIN RETAINED</text>

  <!-- Bottom section title -->
  <text x="50" y="272" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">BriefCensus: Rooftop PV Fleet Monitor Selection</text>
  <text x="550" y="272" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end">UK Fleets (16 &amp; 12) · Ausgrid · Zenodo</text>
</svg>
