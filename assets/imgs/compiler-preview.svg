<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-comp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#bg-comp)"/>
  
  <circle cx="300" cy="65" r="22" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="72" fill="#fff" font-family="monospace" font-weight="bold" font-size="18" text-anchor="middle">+</text>
  
  <line x1="285" y1="80" x2="200" y2="130" stroke="#475569" stroke-width="2"/>
  <circle cx="190" cy="140" r="20" fill="#6366f1" stroke="#818cf8" stroke-width="2"/>
  <text x="190" y="146" fill="#fff" font-family="monospace" font-weight="bold" font-size="17" text-anchor="middle">*</text>

  <line x1="315" y1="80" x2="400" y2="130" stroke="#475569" stroke-width="2"/>
  <circle cx="410" cy="140" r="20" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="410" y="146" fill="#fff" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">b</text>

  <line x1="178" y1="155" x2="135" y2="205" stroke="#475569" stroke-width="2"/>
  <circle cx="125" cy="215" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="125" y="221" fill="#fff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">m</text>

  <line x1="202" y1="155" x2="245" y2="205" stroke="#475569" stroke-width="2"/>
  <circle cx="255" cy="215" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="255" y="221" fill="#fff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">x</text>

  <rect x="350" y="195" width="190" height="42" rx="6" fill="#020617" stroke="#334155"/>
  <text x="445" y="215" fill="#e2e8f0" font-family="monospace" font-size="12" text-anchor="middle">y = m * x + b</text>
  <text x="445" y="229" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">[IDENT] [OP_ASSIGN] [EXPR]</text>

  <text x="300" y="278" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Abstract Syntax Tree (AST) &amp; Lexer Parser Engine</text>
</svg>